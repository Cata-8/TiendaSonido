<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style_musica.css">
    <link rel="stylesheet" href="css/detalle.css">
    <title>Document</title>
</head>
<body>
    
    <h1>Detalle del Producto</h1>

    <img id="imagen" width="300">
    <h2 id="nombre"></h2>
    <p id="marca"></p>
    <p id="modelo"></p>
    <p id="precio"></p>
    <p id="descripcion"></p><br>

    <div>
        <button class="btn-primario" onclick="agregarAlCarrito()">Agregar al carrito</button>
        <a href="catalogo.html"><button>Volver al Catálogo</button></a>
    </div>

    <footer class="footer">
    <div class="footer-contenido">
        <div class="footer-columna logo-footer">
            <h2>SONIDO VIVO</h2>
            <p>Instrumentos para almas nocturnas</p>
        </div>
        <div class="footer-columna">
            <h3>INFORMACIÓN</h3>

            <form>

                <label for="correo">Correo electrónico</label>

                <label for="mensaje">Comentario o mensaje</label>
                <textarea id="mensaje" name="mensaje"></textarea>
                <button type="submit">ENVIAR</button>

        </div>
    </div>
        <div class="footer-final">
