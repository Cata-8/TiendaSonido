<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style_musica.css">
    <link rel="stylesheet" href="css/carrito.css">
    <link rel="stylesheet" href="css/usuario.css">
    <title>Document</title>
</head>
<body>


    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">SONIDO VIVO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="inicio.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ubicacion.html">Ubicación</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== Hero ===== -->
    <section class="carrito-hero">
        
        <h1>Mi Cuenta</h1>
        <p class="carrito-subtitulo" id="bienvenidaTexto">Bienvenido de vuelta</p>
    </section>

    <!-- ===== Contenido ===== -->
    <div class="container cuenta-layout">

        <!-- Tarjeta de perfil -->
        <div class="cuenta-perfil">

            <div class="cuenta-perfil-header">
                <div class="cuenta-avatar" id="avatarInicial">U</div>
                <div>
                    <h2 id="nombreCompleto">Cargando...</h2>
                    <span class="badge-rol" id="tipoBadge">cliente</span>
                </div>
            </div>

            <div class="cuenta-datos">
                <div class="cuenta-dato">
                    <span class="cuenta-dato-label">RUN</span>
                    <span class="cuenta-dato-valor" id="campoRun">-</span>
                </div>
                <div class="cuenta-dato">
                    <span class="cuenta-dato-label">Correo</span>
                    <span class="cuenta-dato-valor" id="campoCorreo">-</span>
                </div>
                <div class="cuenta-dato">
                    <span class="cuenta-dato-label">Fecha de nacimiento</span>
                    <span class="cuenta-dato-valor" id="campoFecha">-</span>
                </div>
                <div class="cuenta-dato">
                    <span class="cuenta-dato-label">Región / Comuna</span>
                    <span class="cuenta-dato-valor" id="campoComuna">-</span>
                </div>
                <div class="cuenta-dato full">
                    <span class="cuenta-dato-label">Dirección</span>
                    <span class="cuenta-dato-valor" id="campoDireccion">-</span>
                </div>
            </div>
        </div>

        <!-- Panel de acciones -->
        <aside class="resumen-compra cuenta-acciones-panel">
            <h2>Mi actividad</h2>

            <a href="carrito.html" class="cuenta-accion">
                <i class="bi bi-cart3"></i>
                <span>Ver mi carrito</span>
            </a>

            <a href="catalogo.html" class="cuenta-accion">
                <i class="bi bi-guitar"></i>
                <span>Seguir comprando</span>
            </a>

            <div class="cuenta-accion cuenta-compras-vacio">
                <i class="bi bi-bag-check"></i>
                <span>Aún no tienes compras registradas</span>
            </div>

            <button class="btn-comprar cuenta-btn-salir" onclick="cerrarSesion()">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
        </aside>

    </div>

    <script src="usuario.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
