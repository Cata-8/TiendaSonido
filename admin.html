<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/admin.css">
    <title>Document</title>
</head>
<body class="admin-body">

    <div class="admin-wrapper">

        <!-- ===== Sidebar ===== -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <strong>SONIDO VIVO</strong>
                <span>PANEL ADMINISTRADOR</span>
            </div>

            <nav class="admin-nav">
                <a href="admin.html" class="active"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
                <a href="admin_productos.html"><i class="bi bi-guitar"></i><span>Productos</span></a>
                <a href="admin_usuarios.html"><i class="bi bi-people-fill"></i><span>Usuarios</span></a>
            </nav>

            <div class="admin-sidebar-footer">
                <a href="inicio.html"><i class="bi bi-box-arrow-left"></i><span>Volver al sitio</span></a>
                <a href="login.html"><i class="bi bi-power"></i><span>Cerrar sesión</span></a>
            </div>
        </aside>

        <!-- ===== Contenido principal ===== -->
        <main class="admin-main">
            <div class="admin-topbar">
                <h1>Dashboard</h1>
                <div class="admin-topbar-user">
                    <span>Admin</span>
                    <div class="avatar">A</div>
                </div>
            </div>

            <div class="admin-content">

                <div class="admin-stats">
                    <div class="admin-stat-card">
                        <div class="admin-stat-icon icon-morado"><i class="bi bi-box-seam-fill"></i></div>
                        <div class="admin-stat-info">
                            <div class="valor" id="statProductos">--</div>
                            <div class="etiqueta">Productos totales</div>
                        </div>
                    </div>

                    <div class="admin-stat-card">
                        <div class="admin-stat-icon icon-amarillo"><i class="bi bi-exclamation-triangle-fill"></i></div>
                        <div class="admin-stat-info">
                            <div class="valor" id="statStockBajo">--</div>
                            <div class="etiqueta">Con stock bajo (≤3)</div>
                        </div>
                    </div>

                    <div class="admin-stat-card">
                        <div class="admin-stat-icon icon-rosa"><i class="bi bi-people-fill"></i></div>
                        <div class="admin-stat-info">
                            <div class="valor" id="statUsuarios">--</div>
                            <div class="etiqueta">Usuarios registrados</div>
                        </div>
                    </div>

                    <div class="admin-stat-card">
                        <div class="admin-stat-icon icon-verde"><i class="bi bi-cart-check-fill"></i></div>
                        <div class="admin-stat-info">
                            <div class="valor" id="statCarritos">--</div>
                            <div class="etiqueta">Productos en carrito (invitado)</div>
                        </div>
                    </div>
                </div>

                <div class="admin-panel-box">
                    <h2>Accesos rápidos</h2>
                    <div style="display:flex; gap:14px; flex-wrap:wrap;">
                        <a href="admin_productos.html" class="btn-admin btn-admin-primario"><i class="bi bi-plus-lg"></i> Gestionar productos</a>
                        <a href="admin_usuarios.html" class="btn-admin btn-admin-secundario"><i class="bi bi-person-plus"></i> Gestionar usuarios</a>
                    </div>
                </div>

            </div>
        </main>

    </div>

    <script src="catalogo.js"></script>
    <script src="admin.js"></script>
</body>
</html>
