<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tituloPagina">Nuevo Usuario | Panel Administrador</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <strong>SONIDO VIVO</strong>
                <span>Panel Administrador</span>
            </div>
            <nav class="admin-nav">
                <a href="admin.html"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
                <a href="admin_productos.html"><i class="bi bi-guitar"></i><span>Productos</span></a>
                <a href="admin_usuarios.html" class="active"><i class="bi bi-people-fill"></i><span>Usuarios</span></a>
            </nav>
            <div class="admin-sidebar-footer">
                <a href="inicio.html"><i class="bi bi-box-arrow-left"></i><span>Volver al sitio</span></a>
                <a href="login.html"><i class="bi bi-power"></i><span>Cerrar sesión</span></a>
            </div>
        </aside>
        <main class="admin-main">
            <div class="admin-topbar">
                <h1 id="tituloFormulario">Nuevo Usuario</h1>
                <div class="admin-topbar-user">
                    <span>Admin</span>
                    <div class="avatar">A</div>
                </div>
            </div>
            <div class="admin-content">
                <div class="admin-panel-box" style="max-width:600px;">
                    <form id="formUsuario" onsubmit="return guardarUsuario(event)">
                        <div class="admin-form-grid">
                            <div class="admin-form-group">
                                <label>RUN (sin puntos ni guión)</label>
                                <input type="text" id="run" maxlength="9" placeholder="Ej: 12345678K" required>
                            </div>
                            <div class="admin-form-group">
                                <label>Tipo de usuario</label>
                                <select id="tipoUsuario" required>
                                    <option value="">Seleccione tipo de usuario</option>
                                    <option value="cliente">Cliente</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>
                            <div class="admin-form-group full">
                                <label>Nombre</label>
                                <input type="text" id="nombre" required>
                            </div>
                            <div class="admin-form-group">
                                <label>Apellidos</label>
                                <input type="text" id="apellidos" maxlength="100" required>
                            </div>
                            <div class="admin-form-group full">
                                <label>Correo</label>
                                <input type="email" id="correo" required>
                            </div>
                            <div class="admin-form-group">
                                <label>Fecha de nacimiento (opcional)</label>
                                <input type="date" id="fechaNacimiento">
                            </div>
                            <div class="admin-form-group">
                                <label>Región</label>
                                <select id="region" required></select>
                            </div>
                            <div class="admin-form-group">
                                <label>Comuna</label>
                                <select id="comuna" required></select>
                            </div>
                            <div class="admin-form-group full">
                                <label>Dirección</label>
                                <input type="text" id="direccion" maxlength="300" required>
                            </div>
                            <div class="admin-form-group">
                                <label>Clave</label>
                                <input type="password" id="clave" maxlength="4" required>
                            </div>
                        </div>
                        <div class="admin-form-actions">
                            <button type="submit" class="btn-admin btn-admin-primario">
                                <i class="bi bi-check-lg"></i> Guardar usuario
                            </button>
                            <a href="admin_usuarios.html" class="btn-admin btn-admin-secundario">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
    <script src="admin_editar_user.js"></script>
</body>
</html>
