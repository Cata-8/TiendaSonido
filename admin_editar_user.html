<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tituloPagina">Nuevo Usuario | Panel Administrador</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

    <div class="admin-wrapper">

        <aside class="admin-sidebar">
            <div class="admin-logo">
                <strong>SONIDO VIVO</strong>
                <span>Panel Administrador</span>
            </div>

            <nav class="admin-nav">
                <a href="admin.html"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
                <a href="admin-productos.html"><i class="bi bi-guitar"></i><span>Productos</span></a>
                <a href="admin-usuarios.html" class="active"><i class="bi bi-people-fill"></i><span>Usuarios</span></a>
            </nav>

            <div class="admin-sidebar-footer">
                <a href="index.html"><i class="bi bi-box-arrow-left"></i><span>Volver al sitio</span></a>
                <a href="login.html"><i class="bi bi-power"></i><span>Cerrar sesión</span></a>
            </div>
        </aside>

        <main class="admin-main">
            <div class="admin-topbar">
                <h1 id="tituloFormulario">Nuevo Usuario</h1>
                <div class="admin-topbar-user">
                    <span>Admin</span>
                    <div class="avatar">A</div>
                </div>
            </div>

            <div class="admin-content">
                <div class="admin-panel-box" style="max-width:600px;">

                    <form id="formUsuario" onsubmit="return guardarUsuario(event)">

                        <div class="admin-form-grid">

                            <div class="admin-form-group full">
                                <label>Nombre completo</label>
                                <input type="text" id="nombre" required>
                            </div>

                            <div class="admin-form-group full">
                                <label>Correo</label>
                                <input type="email" id="correo" required>
                            </div>

                            <div class="admin-form-group">
                                <label>Clave</label>
                                <input type="password" id="clave" maxlength="4" required>
                            </div>

                            <div class="admin-form-group">
                                <label>Rol</label>
                                <select id="rol" required>
                                    <option value="cliente">Cliente</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>

                        </div>

                        <div class="admin-form-actions">
                            <button type="submit" class="btn-admin btn-admin-primario">
                                <i class="bi bi-check-lg"></i> Guardar usuario
                            </button>
                            <a href="admin-usuarios.html" class="btn-admin btn-admin-secundario">Cancelar</a>
                        </div>

                    </form>

                </div>
            </div>
        </main>

    </div>

    <script src="admin.js"></script>
    <script src="admin-usuario-form.js"></script>
</body>
</html>
